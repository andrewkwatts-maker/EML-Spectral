[package]
name = "eml_spectral_core"
version = "2.0.0-alpha.0"
edition = "2021"

[lib]
name = "eml_spectral_core"
crate-type = ["cdylib", "lib"]

[features]
# PyPI / maturin builds: enable python so the extension module is built.
# Engine workspace: python is NOT in default so pyo3 is never pulled in.
default = []
python = ["pyo3"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
rayon = "1.10"
