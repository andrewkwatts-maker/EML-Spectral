[package]
name = "eml_spectral_core"
version = "2.0.0-alpha.0"
edition = "2021"

[lib]
name = "eml_spectral_core"
crate-type = ["cdylib", "lib"]

[features]
default = []
# Optional Arithmos symbolic-substrate bridge. ONLY available when consumed via
# git submodule path-dep (the engine workspace) — never as a PyPI dep.
# See plan §F.11 for the cross-library `with-arithmos` pattern.
with-arithmos = ["arithmos_core"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
arithmos_core = { path = "../../../Arithmos/rust/arithmos_core", optional = true }
