[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eml-spectral"
version = "2.0.0a0"
description = "EML-tree representations of Clifford algebras, octonions, exceptional algebras (E7/E8/Freudenthal), named GR metrics, lattices, and Lorentz-invariant ops. Built on eml-math."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Andrew K Watts", email = "andrewkwatts@gmail.com" }
]
keywords = [
    "mathematics",
    "physics",
    "eml",
    "clifford-algebra",
    "geometric-algebra",
    "octonions",
    "exceptional-algebras",
    "freudenthal",
    "e7",
    "e8",
    "general-relativity",
    "schwarzschild",
    "flrw",
    "lorentz",
    "minkowski",
    "leech-lattice",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
requires-python = ">=3.11"
dependencies = [
    "eml-math>=1.3.0",
]

[project.optional-dependencies]
ext = [
    "numpy>=1.26",
    "sympy>=1.12",
]
precision = [
    "mpmath>=1.3.0",
]
rust = [
    "maturin>=1.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.9",
    "maturin>=1.5",
]

[project.urls]
Homepage = "https://github.com/andrewkwatts-maker/EML-Spectral"
Repository = "https://github.com/andrewkwatts-maker/EML-Spectral"
"Bug Tracker" = "https://github.com/andrewkwatts-maker/EML-Spectral/issues"
"Sister package (core EML)" = "https://github.com/andrewkwatts-maker/EML-Math"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
