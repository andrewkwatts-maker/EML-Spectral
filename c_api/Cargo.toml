[package]
name = "eml_spectral_c_api"
version = "1.0.0"
edition = "2021"
description = "C-compatible API for the eml-spectral library."

[lib]
name = "eml_spectral"
# "lib" is present so the Rust test harness can link this crate and check the
# C ABI against the eml_spectral_core implementation it duplicates. It does not
# change the staticlib / cdylib artefacts a C consumer links against.
crate-type = ["staticlib", "cdylib", "lib"]

[dev-dependencies]
# Test-only: the octonion table, blade product and spectral-flow guards exist in
# both crates, so the tests pin the two copies to each other.
eml_spectral_core = { path = "../rust/eml_spectral_core" }
