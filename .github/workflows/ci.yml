name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build tools
        run: pip install --upgrade pip maturin

      - name: Install eml-math from source (pinned to current branch / latest PyPI)
        # eml-spectral depends on eml-math >=1.3.0. The published wheel is
        # picked up automatically via the dependency declaration below.
        run: pip install eml-math

      - name: Install eml-spectral with dev deps
        run: pip install .[dev,ext]

      - name: Run tests
        run: pytest tests/ -v --tb=short
